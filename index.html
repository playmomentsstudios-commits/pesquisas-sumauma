<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pesquisas – Instituto Sumaúma</title>

  <!-- Leaflet (OpenStreetMap) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- CSS do projeto -->
  <link rel="stylesheet" href="./src/css/style.css" />
  <link rel="stylesheet" href="./src/css/responsivo-ui.css" />
  <link rel="stylesheet" href="assets/css/header.css" />

  <!-- SUMAUMA: FAVICON LINKS (BEGIN) -->
  <!-- Os hrefs são preenchidos pelo app.js (busca no site_config) -->
  <!-- Favicon dinâmico (carregado via site_config) -->
  <link id="siteFavicon" rel="icon" href="./public/assets/favicon.png" />
  <!-- SUMAUMA: FAVICON LINKS (END) -->
</head>

<body>
  <header class="site-banner">
    <div class="site-banner__inner">
      <!-- LOGO (maior, ~150px) -->
      <div class="site-brand">
        <!-- Troque o caminho da imagem se necessário -->
        <a href="/" aria-label="Home">
          <img class="site-brand__logo" src="assets/img/logo.png" alt="Logo do site" />
        </a>
      </div>

      <!-- AÇÕES (busca à esquerda do menu, menu no canto direito) -->
      <div class="site-actions">
        <!-- BUSCA -->
        <form class="site-search" action="#" method="GET" role="search">
          <input name="q" type="search" placeholder="Buscar pesquisas..." aria-label="Buscar pesquisas" />
        </form>

        <!-- MENU -->
        <nav class="site-menu" aria-label="Menu principal">
          <!-- Dropdown Pesquisas -->
          <div class="dropdown" data-dropdown="pesquisas">
            <button class="btn" type="button" data-dropdown-toggle>
              Pesquisas <span class="chev">▾</span>
            </button>
            <div class="dropdown__panel" data-dropdown-panel>
              <!-- Ajuste os links conforme suas rotas reais -->
              <a href="/pesquisas.html">Ver todas</a>
              <a href="/mapa.html">Mapa</a>
              <a href="/categorias.html">Categorias</a>
            </div>
          </div>

          <!-- Institucional -->
          <a class="btn" href="/institucional.html">Institucional</a>
        </nav>
      </div>
    </div>
  </header>

  <!-- SPA -->
  <main id="app" class="app" aria-live="polite"></main>

  <footer class="footer">
    © <span id="year"></span> Instituto Sumaúma
  </footer>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Supabase (public) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>

  <!-- App -->
  <script type="module" src="./src/js/app.js"></script>
  <script src="assets/js/header.js"></script>
</body>
</html>
