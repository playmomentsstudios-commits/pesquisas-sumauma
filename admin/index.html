<section class="login-stage">

  <!-- imagem de fundo -->
  <div class="login-stage__bg">
    <img id="loginBg" src="/img/capa.jpg" style="width:100%;height:100%;object-fit:cover;">
  </div>

  <!-- overlay escuro -->
  <div class="login-stage__overlay"></div>

  <!-- card de login -->
  <div class="login-card">

      <div style="text-align:center;margin-bottom:20px;">
          <img id="loginLogo" src="/img/logo.png" style="max-width:120px;">
      </div>

      <form id="loginForm">

          <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" id="emailInput" type="email" required>
          </div>

          <div class="form-group">
              <label class="form-label">Senha</label>
              <input class="form-input" id="passwordInput" type="password" required>
          </div>

          <button class="btn btn--primary btn--block" type="submit">
              Entrar
          </button>

      </form>

      <div id="loginError" class="alert alert--error" hidden></div>

  </div>
</section>
