<section class="login-stage">

  <!-- fundo -->
  <div class="login-stage__bg">
    <img id="loginBg" src="/img/capa.jpg">
  </div>

  <!-- overlay gradiente -->
  <div class="login-stage__overlay"></div>

  <!-- login -->
  <div class="login-card">

      <div class="login-card__logo">
          <img id="loginLogo" src="/img/logo.png">
      </div>

      <form id="loginForm">

          <div class="form-group">
              <label class="form-label">Email</label>
              <input class="form-input" id="emailInput" type="email" placeholder="seu@email.com" required>
          </div>

          <div class="form-group">
              <label class="form-label">Senha</label>
              <input class="form-input" id="passwordInput" type="password" placeholder="••••••••" required>
          </div>

          <button class="btn-login" type="submit">
              Entrar
          </button>

      </form>

      <div id="loginError" class="alert alert--error" hidden></div>

  </div>

</section>
